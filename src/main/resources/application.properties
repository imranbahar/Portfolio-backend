spring.application.name=Imran_Bahar

# Database configuration using environment variables with local fallbacks
# Syntax: ${VARIABLE_NAME:default_local_value}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

